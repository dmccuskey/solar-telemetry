[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-telemetry"
version = "0.1.0"
description = "Reads a Renogy Wanderer charge controller over Bluetooth LE and writes the readings to InfluxDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["bleak>=2.1"]

[project.scripts]
solar-telemetry = "solar_telemetry.service:main"
solar-telemetry-weather = "solar_telemetry.weather:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["solar_telemetry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
