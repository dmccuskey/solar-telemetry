# The service's config. Copy it to config.toml (kept out of git: it holds the
# controller's MAC address) and run: solar-telemetry config.toml

[controller]
name = "car"                   # the `controller` tag on every point
address = "AA:BB:CC:DD:EE:FF"  # the BT module's MAC address: tools/scan_ble.py finds it

# Optional: the defaults are shown.
[schedule]
interval_s = 300               # between readings, at its marks on the clock (:00:15, :05:15, ...)
away_interval_s = 300          # between tries while the car is away

[influxdb]
url = "http://127.0.0.1:8086"
database = "solar"             # created on the first write if missing

# Optional, for the weather job (solar-telemetry-weather): sunlight and cloud
# cover from Open-Meteo for where the panel is. The service ignores it.
# [weather]
# latitude = 0.0               # degrees, north positive
# longitude = 0.0              # degrees, east positive
# refresh_s = 900              # between fetches, at its marks on the clock plus a minute; at least 60.
#                              # Open-Meteo's values are 15-minute ones: shorter fetches them sooner, not finer
