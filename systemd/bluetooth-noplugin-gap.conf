# A drop-in for bluetooth.service: bluetoothd without its GAP plugin.
# Install as /etc/systemd/system/bluetooth.service.d/noplugin-gap.conf.
#
# The plugin reads the BT module's preferred connection parameters (100-200 ms)
# and has the kernel use them, while the module asks for 10-20 ms itself once
# connected. The two overwrite each other's stored setting in turn, so every
# other connect ran at 200 ms and took 11 s instead of 1.3 s. Nothing else the
# plugin reads (the device name, its appearance) is needed.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=gap
