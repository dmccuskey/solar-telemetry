# A drop-in for systemd-journald: keep the journal across reboots.
# Install as /etc/systemd/journald.conf.d/60-persistent.conf.
#
# Raspberry Pi OS keeps the journal in memory only
# (/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf), so a reboot
# loses the logs from before it: the ones that say why it rebooted. This file
# sorts after that one, so its settings win.
#
# The Pi writes about 18 MB of journal a day; 200 MB keeps about 10 days and
# caps the SD card's share. Writing to disk every minute, rather than every
# 5 minutes, keeps all but the last minute before a hang or power loss.
[Journal]
Storage=persistent
SystemMaxUse=200M
SyncIntervalSec=1m
